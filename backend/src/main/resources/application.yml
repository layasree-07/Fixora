

spring:
  application:
    name: fixora

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fixora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

fixora:
  cors:
    allowed-origin: "${FRONTEND_ORIGIN:http://localhost:5173}"
  jwt:
    secret: "${JWT_SECRET:}"

